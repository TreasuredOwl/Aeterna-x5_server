# ---------------------------------------------------------------------------
# Налаштування логин сервера 
# ---------------------------------------------------------------------------
# Файл конфігурації логин сервера. Тут ви визначаєте інформацію про підключення.
# Написано з урахуванням того, що ви знаходитесь за маршрутизатором.
# Спрощені визначення...
# LAN (локальна мережа) - комп'ютери, підключені до того самого маршрутизатора, що й ви.
# WAN (зовнішня мережа) - комп'ютери ПОЗА вашим маршрутизатором (тобто інтернет).
# x.x.x.x - Формат IP-адреси. Не включайте "x" у налаштування. Використовуйте реальні цифри.

# ---------------------------------------------------------------------------
# Айпи та Порт
# ---------------------------------------------------------------------------

# IP прослуховування сервера логіна. Використовуйте 0.0.0.0 для прослуховування всіх доступних IP-адрес.
# ПОПЕРЕДЖЕННЯ: <u><b><font color="red">Не змінюйте IP-адреси за замовчуванням, якщо не знаєте, що робите!</font></b></u>
# ПОПЕРЕДЖЕННЯ: <u><b><font color="red">Зовнішні/внутрішні IP-адреси тепер знаходяться у файлі "ipconfig.xml".</font></b></u>
# За замовчуванням: 127.0.0.1
LoginserverHostname = 127.0.0.1

# За замовчуванням: 2106
LoginserverPort = 2106

# Адреса, на якій login буде очікувати підключення GameServers, використовуйте * для прив'язки до всіх доступних IP-адрес
# УВАГА: <u><b><font color="red">Будь ласка, не змінюйте стандартні IP-адреси тут, якщо ви не знаєте, що робите!</font></b></u>
# УВАГА: <u><b><font color="red">Зовнішні/внутрішні IP-адреси тепер знаходяться у файлі "ipconfig.xml".</font></b></u>
# За замовчуванням: 127.0.0.1
# Docker: має прив'язуватися до всіх інтерфейсів, щоб інші контейнери могли підключитися.
LoginHostname = 127.0.0.1

# Порт, де логін прослуховує з'єднання від ігрових серверів.
# За замовчуванням: 9014
LoginPort = 9014

# Список IP-адрес, яким дозволено підключатися до цього порту (розділені комами).

# Залиште поле порожнім, щоб приймати з будь-якої IP-адреси (за замовчуванням, сумісно з попередніми версіями).
# Рекомендовано, коли вищевказаний порт публічно доступний: обмежтеся реальними IP-адресами ігрових серверів, 
# щоб запобігти генерації інтернет-сканерами/ботами недійсних з'єднань у журналах (наприклад, "Недійсна довжина пакета", "Неповний пакет").
# Підключення можуть здійснювати лише IP-адреси, перелічені тут; будь-які інші відхиляються. Жодних
# IP-адреси автоматично додаються до цього списку або видаляються з нього сервером.
# Список змінюється лише в тому випадку, якщо адміністратор редагує цей файл вручну.
# За замовчуванням: (порожньо)
GameServerAllowedHosts = 

# ---------------------------------------------------------------------------
# Налаштування потоків
# ---------------------------------------------------------------------------

# Кількість потоків у пулі запланованих завдань.
# Якщо встановлено значення -1, буде розраховано автоматично (доступні процесори / 2).
ScheduledThreadPoolSize = 2

# Кількість потоків у пулі миттєвих завдань.
# Якщо встановлено -1, буде розраховано автоматично (доступні процесори / 2).
InstantThreadPoolSize = 2


# ---------------------------------------------------------------------------
# Безпека
# ---------------------------------------------------------------------------

# Скільки спроб входу в систему з помилками, перш ніж IP-адресу буде заблоковано.
# За замовчуванням: 5
LoginTryBeforeBan = 5

# Час (у секундах), протягом якого IP-адресу заблоковано після досягнення ліміту спроб.
# За замовчуванням: 900 (15 хвилин)
LoginBlockAfterBan = 900

# Захист від флуд з'єднань. Усі значення вказані в мілісекундах.
# За замовчуванням: True
EnableFloodProtection = True

# За замовчуванням: 15
FastConnectionLimit = 15

# За замовчуванням: 700
NormalConnectionTime = 700

# За замовчуванням: 350
FastConnectionTime = 350

# За замовчуванням: 50
MaxConnectionPerIP = 50


# ---------------------------------------------------------------------------
# Інші налаштування входу
# ---------------------------------------------------------------------------

# Якщо вимкнено, ліцензія (після входу в гру) не відображатиметься.
# За замовчуванням: True
ShowLicence = True

# За замовчуванням: True
AutoCreateAccounts = True

# Кореневий каталог датапаку.
# За замовчуванням: поточний каталог, з якого запускається сервер.
DatapackRoot = .


# ---------------------------------------------------------------------------
# Запланований перезапуск логин сервера
# ---------------------------------------------------------------------------

# Вмикає або вимикає заплановане перезавантаження логин сервера.
# За замовчуванням: False
LoginRestartSchedule = True
# Час у годинах.
# За замовчуванням: 24
LoginRestartTime = 24
